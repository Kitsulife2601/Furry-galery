<!DOCTYPE html>
<html>
<head>
  <style>
    html, body { margin: 0; background: #666; }
    .row { display: flex; gap: 24px; padding: 16px; align-items: end; }
    .cell { text-align: center; color: #fff; font: 12px sans-serif; }
    img { image-rendering: pixelated; display: block; background: #fff; }
  </style>
</head>
<body>
  <div class="row">
    <div class="cell"><img src="./favicon-src.svg" width="16" height="16" />16</div>
    <div class="cell"><img src="./favicon-src.svg" width="32" height="32" />32</div>
    <div class="cell"><img src="./favicon-src.svg" width="64" height="64" />64</div>
  </div>
</body>
</html>
